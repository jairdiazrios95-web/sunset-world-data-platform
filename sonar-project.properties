# SonarQube configuration for Sunset World Data Platform
# Requires an accessible SonarQube/SonarCloud server and SONAR_TOKEN.
# These settings alone do NOT represent a completed SonarQube analysis.
sonar.projectKey=sunset-world-data-platform
sonar.projectName=Sunset World Data Platform
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=sunset,warehouse,oracle,rag,streaming,airflow/dags,scripts,stress
sonar.tests=tests
sonar.test.inclusions=tests/test_*.py
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/generated/**,data/**,reports/**,deliverables/**,notebooks/**
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.scm.provider=git
