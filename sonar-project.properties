# SonarQube configuration for Sunset World Data Platform
# Requires an accessible SonarQube/SonarCloud server and SONAR_TOKEN.
# These settings alone do NOT represent a completed SonarQube analysis.
sonar.projectKey=sunset-world-data-platform
sonar.projectName=Sunset World Data Platform
sonar.projectDescription=Reproducible synthetic data engineering integrations; nonproduction scope
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=sunset,warehouse,oracle,rag,streaming,airflow/dags,scripts,stress
sonar.tests=tests
sonar.test.inclusions=tests/test_*.py
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/generated/**,data/**,reports/**,deliverables/**,notebooks/**
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.scm.provider=git

# Amazon S3's ExpectedBucketOwner is an AWS account identifier; our MinIO
# S3-compatible endpoint does not expose AWS account ownership semantics.
# Restrict exception to these two MinIO-only callers; keep S7608 enabled for
# all other source files, including future AWS S3 adapters.
sonar.issue.ignore.multicriteria=minioPublisher,minioRoundtrip
sonar.issue.ignore.multicriteria.minioPublisher.ruleKey=python:S7608
sonar.issue.ignore.multicriteria.minioPublisher.resourceKey=sunset/minio.py
sonar.issue.ignore.multicriteria.minioRoundtrip.ruleKey=python:S7608
sonar.issue.ignore.multicriteria.minioRoundtrip.resourceKey=scripts/verify_minio_live.py
