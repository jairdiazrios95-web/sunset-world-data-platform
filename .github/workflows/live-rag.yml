name: sunset-real-huggingface-pgvector-rag
on:
  workflow_call:
  workflow_dispatch:

jobs:
  real-rag:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sunset
          POSTGRES_USER: sunset
          POSTGRES_PASSWORD: ci_local_only_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunset -d sunset"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      SUNSET_PG_DSN: postgresql://sunset:ci_local_only_2026@localhost:5432/sunset
      RAG_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual embedding model dependency and PostgreSQL adapter
        run: python -m pip install -r requirements-ai.txt
      - name: Create actual pgvector schema
        run: python scripts/bootstrap_db.py
      - name: Download/load actual model and test pgvector RAG replay
        run: python scripts/verify_rag_live.py --report reports/real_rag_verified.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunset-proof-rag
          path: reports/real_rag_verified.json
          if-no-files-found: warn
