name: sunset-static-security-and-sonarqube
on:
  push:
    branches: [main, quality/sonarqube-ready-20261019]
    paths:
      - '.github/workflows/quality-sonarqube.yml'
      - '.github/workflows/ephemeral-sonarqube.yml'
      - 'sonar-project.properties'
      - 'sunset/**'
      - 'warehouse/**'
      - 'oracle/**'
      - 'rag/**'
      - 'streaming/**'
      - 'airflow/dags/**'
      - 'scripts/**'
      - 'stress/**'
      - 'tests/**'
  pull_request:
permissions:
  contents: read
jobs:
  static-and-coverage:
    name: Python static checks, Bandit high severity, and measured coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned audit utilities
        run: python -m pip install 'pytest==8.3.5' 'pytest-cov==6.0.0' 'ruff==0.11.13' 'bandit==1.8.3' 'PyYAML==6.0.2' 'pyarrow==19.0.1' 'python-pptx==1.0.2'
      - name: Block Python syntax and undefined-name defects
        run: python -m ruff check --select E9,F63,F7,F82 sunset warehouse oracle rag streaming airflow/dags scripts stress
      - name: Block high-confidence high-severity security defects
        run: python -m bandit -r sunset warehouse oracle rag streaming airflow/dags scripts stress --severity-level high --confidence-level high --format json --output bandit-high.json
      - name: Run regression tests and produce measured coverage
        run: python -m pytest -q tests --cov=sunset --cov=warehouse --cov=oracle --cov=rag --cov=streaming --cov=airflow/dags --cov=scripts --cov=stress --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=90
      - name: Save measurable security and coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunset-static-audit-${{ github.sha }}
          path: |
            coverage.xml
            bandit-high.json
          if-no-files-found: warn
  sonarqube:
    name: SonarQube scan and server Quality Gate (requires connection)
    runs-on: ubuntu-22.04
    needs: static-and-coverage
    if: ${{ vars.SONAR_HOST_URL != '' }}
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require actual SonarQube token when host is set
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_HOST_URL is configured but SONAR_TOKEN is missing"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: sunset-static-audit-${{ github.sha }}
      - name: Execute SonarScanner against configured server
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - name: Enforce server Quality Gate result
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
