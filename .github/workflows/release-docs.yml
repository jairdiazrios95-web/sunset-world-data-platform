name: sunset-final-deliverables-build
on:
  push:
    branches: [release/final-docs-20261019]
    paths:
      - '.github/workflows/release-docs.yml'
      - 'docs/RESPUESTAS_EXAMEN.md'
      - 'scripts/build_presentation.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-validate-deliverables:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and presentation build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended \
            fonts-dejavu-core libreoffice-impress poppler-utils
          python -m pip install 'python-pptx==1.0.2' 'pypdf==5.4.0'
      - name: Regenerate exam technical PDF from reviewed Markdown
        run: bash scripts/render_pdf.sh
      - name: Regenerate editable five-slide presentation
        run: python scripts/build_presentation.py
      - name: Export PowerPoint to final PDF
        run: |
          mkdir -p /tmp/sunset-slide-pdf
          libreoffice -env:UserInstallation=file:///tmp/sunset-office \
            --headless --convert-to pdf \
            --outdir /tmp/sunset-slide-pdf \
            deliverables/Sunset_World_Presentacion_Ejecutiva.pptx
          cp /tmp/sunset-slide-pdf/Sunset_World_Presentacion_Ejecutiva.pdf \
             deliverables/Sunset_World_Presentacion_Ejecutiva.pdf
      - name: Verify readable content, page counts and evidence consistency
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          from pptx import Presentation
          from pathlib import Path
          root = Path('deliverables')
          exam = root/'Sunset_World_Respuestas_Examen.pdf'
          slide_pdf = root/'Sunset_World_Presentacion_Ejecutiva.pdf'
          slides = root/'Sunset_World_Presentacion_Ejecutiva.pptx'
          for path in [exam,slide_pdf,slides]:
              assert path.is_file() and path.stat().st_size > 10000, path
          exam_reader = PdfReader(exam)
          slide_reader = PdfReader(slide_pdf)
          deck = Presentation(slides)
          assert 7 <= len(exam_reader.pages) <= 40, len(exam_reader.pages)
          assert len(slide_reader.pages) == 5
          assert len(deck.slides) == 5
          text = '\n'.join(page.extract_text() or '' for page in exam_reader.pages)
          slide_text = '\n'.join(shape.text for slide in deck.slides for shape in slide.shapes if shape.has_text_frame)
          for required in ['42,800,000', '436.102', '39336589227', '39334943627']:
              assert required in text, f'Missing evidence in technical PDF: {required}'
          for required in ['42.8 M', '42.8M', '39336589227']:
              assert required in slide_text, f'Missing presentation evidence: {required}'
          assert '42.8 M' in slide_text or '42.8M' in slide_text
          assert 'Mantis' in text and 'Oracle 11g' in text
          print('Verified exam pages:',len(exam_reader.pages),
                'slides:',len(deck.slides),
                'technical-PDF bytes:',exam.stat().st_size)
          PY
          pdfinfo deliverables/Sunset_World_Respuestas_Examen.pdf | grep -E 'Pages:|File size:'
          pdfinfo deliverables/Sunset_World_Presentacion_Ejecutiva.pdf | grep -E 'Pages:|File size:'
      - name: Commit actual validated binary deliverables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deliverables/Sunset_World_Respuestas_Examen.pdf \
                  deliverables/Sunset_World_Presentacion_Ejecutiva.pptx \
                  deliverables/Sunset_World_Presentacion_Ejecutiva.pdf
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Generated files unchanged'
          else
            git commit -m 'build(docs): regenerate verified exam and five executive slides'
            git push origin HEAD:release/final-docs-20261019
          fi
      - name: Publish reviewer-ready deliverables as immutable run artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunset-world-final-pdf-pptx
          path: |
            deliverables/Sunset_World_Respuestas_Examen.pdf
            deliverables/Sunset_World_Presentacion_Ejecutiva.pptx
            deliverables/Sunset_World_Presentacion_Ejecutiva.pdf
          if-no-files-found: error
